[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "certifi-learn"
description = "Certifiably Intersectionally Fair & Interpretable models: detection of the most biased subgroup and training of fair interpretable classifiers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jiří Němeček" }]
dependencies = ["numpy>=1.21", "pandas", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.optional-dependencies]
mio = ["pyomo>=6.7"]
gurobi = ["pyomo>=6.7", "gurobipy"]
highs = ["pyomo>=6.7", "highspy"]
examples = ["folktables"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/Epanemu/CertIFI"

[tool.maturin]
python-source = "python"
module-name = "certifi_learn._core"
features = ["pyo3/extension-module"]
